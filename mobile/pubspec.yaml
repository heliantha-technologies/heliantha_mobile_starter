name: heliantha_mobile
description: Application Android Heliantha connectée à PrestaShop via FastAPI.
publish_to: "none"
version: 1.0.0+5

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  file_saver: ^0.3.1
  open_filex: ^4.7.0
  firebase_core: 4.13.0
  firebase_messaging: 16.5.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/helin.jpeg
    - assets/brand/fond_arriere_plan.png
    - assets/docs/RIB CIH Heliantha (1).pdf
